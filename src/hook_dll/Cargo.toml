[package]
name = "macui-hook"
version = "4.3.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
] }
windows-core = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

# Usamos la librería IPC del proyecto
macui-ipc = { path = "../../libs/macui-ipc" }

[dev-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
