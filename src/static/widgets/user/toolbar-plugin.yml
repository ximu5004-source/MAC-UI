id: "@macui/tb-user-menu"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
icon: FaRegCircleUser
target: "@macui/fancy-toolbar"
plugin:
  scopes:
    - User
  tooltip: |-
    return user.displayName;
  template: |-
    return Image({ path: user.profilePicturePath });
  onClickV2: |-
    trigger("@macui/user-menu");
