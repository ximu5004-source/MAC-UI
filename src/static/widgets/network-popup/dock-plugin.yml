id: "@macui/dock-network-popup"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
icon: FaWifi
target: "@macui/weg"
plugin:
  scopes:
    - Network
  render: !include dock_plugin.js
  tooltip: >-
    return usingInterface?.type === "IEEE80211" ? "Wi-Fi" : online ? "Ethernet" : "Disconnected";
  onClick: |-
    trigger("@macui/network-popup");
