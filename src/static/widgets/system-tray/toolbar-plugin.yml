id: "@macui/tb-system-tray"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
icon: IoIosArrowDropdown
target: "@macui/fancy-toolbar"
plugin:
  tooltip: |-
    return "System Tray";
  template: |-
    return Icon({ name: "IoIosArrowDropdown" });
  onClickV2: |-
    trigger("@macui/system-tray");
