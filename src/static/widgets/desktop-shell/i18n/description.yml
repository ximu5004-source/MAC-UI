en: Manage desktop files and glass organizer panels independently of wallpaper. Drag titles to move, drag edges to resize, and toggle grid snapping in the desktop toolbar. Disabling this widget restores Windows desktop icons. Windows or your wallpaper app continues to manage the background.
zh-CN: 独立管理桌面文件与液态玻璃收纳框，不需要开启内置壁纸。拖动标题移动，拖动边缘缩放，桌面工具栏可开关网格吸附。关闭本模块会恢复 Windows 桌面图标；背景继续由 Windows 或你原来的壁纸软件管理。
