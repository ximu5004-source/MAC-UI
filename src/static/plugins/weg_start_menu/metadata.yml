id: "@default/weg-start-menu"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
icon: TbGridDots
target: "@macui/weg"
plugin:
  scopes: []
  noCanvas: true
  render: |-
    return "@macui/weg::start-menu";
  tooltip: |-
    return t("start.label");
  onClick: |-
    invoke(MacUiCommand.ShowStartMenu);
