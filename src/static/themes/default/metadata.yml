id: "@default/theme"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
  tags:
    - weg
    - toolbar
    - window-manager
styles:
  # For devs: key is the id of the target widget and value is the relative path to the style.
  # For third-party widgets uses the real widget id, friendly ids are only for bundle or local themes,
  # as friendly ids are not stable.
  "@macui/fancy-toolbar": !include styles/fancy-toolbar.scss
  "@macui/power-menu": !include styles/power-menu.scss
  "@macui/task-switcher": !include styles/task-switcher.scss
  "@macui/wallpaper-manager": !include styles/wallpaper-manager.css
  "@macui/weg": !include styles/weg.scss
  "@macui/window-manager": !include styles/window-manager.css
  "@macui/system-tray": !include styles/tray-menu.scss
  "@macui/quick-settings": !include styles/quick-settings.scss
  "@macui/bluetooth-popup": !include styles/bluetooth-popup.scss
  "@macui/workspaces-viewer": !include styles/workspaces-viewer.scss
  "@macui/apps-menu": !include styles/apps-menu.scss
  "@macui/keyboard-selector": !include styles/keyboard-selector.scss
  "@macui/user-menu": !include styles/user-menu.scss
  "@macui/network-popup": !include styles/network-popup.scss
  "@macui/calendar-popup": !include styles/calendar-popup.scss
  "@macui/media-popup": !include styles/media-popup.scss
  "@macui/notifications": !include styles/notifications.scss
  "@macui/context-menu": !include styles/context-menu.scss
  "@macui/flyouts": !include styles/flyouts.css
  "@macui/tooltip": !include styles/tooltip.scss
  "@macui/weg-preview": !include styles/weg-preview.scss

# shared styles across all widgets
sharedStyles: !include ./shared/index.scss
