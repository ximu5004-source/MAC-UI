<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAC UI</title>
    <link rel="icon" href="./mac-ui.svg" />
    <link rel="stylesheet" href="./index.css" />
    <script src="/vanilla/entry-point/index.js" type="module"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splashscreen" aria-label="MAC UI">
      <img src="./mac-ui.svg" alt="" width="80" height="80" /><strong>MAC UI</strong><span>JONA</span>
    </div>
    <style>
      #splashscreen { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; background: light-dark(#f5f6f8, #20232b); color: light-dark(#20252d, #f2f4f9); font-family: "Segoe UI", sans-serif; transition: opacity 200ms ease; }
      #splashscreen strong { font-size: 26px; } #splashscreen span { font-size: 12px; opacity: .7; }
      #splashscreen.hidden { display: none; } #splashscreen.vanish { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #splashscreen { transition: none; } }
    </style>
  </body>
</html>
