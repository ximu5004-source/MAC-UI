<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>MAC UI · Local API</title>
<style>body{font:16px/1.6 system-ui;background:#17151e;color:#f2eef9;max-width:960px;margin:48px auto;padding:24px}a{color:#c2adff}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:24px;border:1px solid #494151;border-radius:16px;background:#22202b}</style>
</head><body><h1>MAC UI · Local API</h1><p><a href="/api-doc/openapi.json">OpenAPI specification</a></p>
<pre id="api" aria-live="polite">Loading local API specification…</pre>
<script>fetch("/api-doc/openapi.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>document.querySelector("#api").textContent=JSON.stringify(data,null,2)).catch(()=>document.querySelector("#api").textContent="Unable to load the local API specification.");</script>
</body></html>
